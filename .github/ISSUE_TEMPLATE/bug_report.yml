name: Bug report
description: Report a broken behavior in the app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and briefly.
      placeholder: The progress page crashes when I open it after submitting a revision.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The page should load my current practice path progress without crashing.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest path to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - API / backend
        - Review pipeline
        - Prompt generation
        - Admin
        - Docs
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, or deployment context if relevant.
      placeholder: Chrome 135 on macOS, self-hosted Docker deploy

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste relevant logs or add screenshots if they help explain the issue.
      render: shell

