services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: writing-coach-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      kratos:
        condition: service_started
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WRITING_COACH_API_INTERNAL_URL: "http://app:8080"
      WRITING_COACH_KRATOS_PUBLIC_INTERNAL_URL: "http://kratos:4433"
    ports:
      - "${WEB_PORT_BIND:-127.0.0.1:11234:3000}"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: writing-coach-app
    restart: unless-stopped
    depends_on:
      languagetool:
        condition: service_healthy
      nlp-analyzer:
        condition: service_healthy
      kratos:
        condition: service_started
    environment:
      WRITING_COACH_HTTP_ADDR: ":8080"
      WRITING_COACH_WRITER_NAME: "${WRITING_COACH_WRITER_NAME:-Writer}"
      WRITING_COACH_DEFAULT_USER_SLUG: "${WRITING_COACH_DEFAULT_USER_SLUG:-default}"
      WRITING_COACH_DEFAULT_TREE_SLUG: "${WRITING_COACH_DEFAULT_TREE_SLUG:-global-writing-skill-graph}"
      WRITING_COACH_KRATOS_PUBLIC_URL: "http://kratos:4433"
      LANGUAGETOOL_URL: "http://languagetool:8010"
      WRITING_COACH_NLP_ANALYZER_URL: "http://nlp-analyzer:8020"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      WRITING_COACH_AI_KEY_SECRET: "${WRITING_COACH_AI_KEY_SECRET:-}"
      WRITING_COACH_PROMPT_MODEL: "${WRITING_COACH_PROMPT_MODEL:-gpt-5-mini}"
      WRITING_COACH_REVIEW_MODEL: "${WRITING_COACH_REVIEW_MODEL:-gpt-5-mini}"
      WRITING_COACH_AI_VALIDATE_LIMIT_PER_MINUTE: "${WRITING_COACH_AI_VALIDATE_LIMIT_PER_MINUTE:-6}"
      WRITING_COACH_AI_VALIDATE_GLOBAL_LIMIT_PER_MINUTE: "${WRITING_COACH_AI_VALIDATE_GLOBAL_LIMIT_PER_MINUTE:-60}"
      WRITING_COACH_AI_PROVIDER_EVENT_RETENTION_DAYS: "${WRITING_COACH_AI_PROVIDER_EVENT_RETENTION_DAYS:-30}"
    volumes:
      - writing-coach-data:/app/.writing-coach

  languagetool:
    build:
      context: .
      dockerfile: docker/languagetool/Dockerfile
    container_name: writing-coach-languagetool
    restart: unless-stopped

  nlp-analyzer:
    build:
      context: .
      dockerfile: docker/nlp-analyzer/Dockerfile
    container_name: writing-coach-nlp-analyzer
    restart: unless-stopped
    environment:
      CORENLP_URL: "${NLP_CORENLP_URL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  corenlp:
    image: "haub/corenlp:4.5.7"
    container_name: writing-coach-corenlp
    restart: unless-stopped
    profiles: ["phase4-nlp"]
    environment:
      JAVA_TOOL_OPTIONS: "${CORENLP_JAVA_TOOL_OPTIONS:--Xms512m -Xmx1536m}"

  kratos-migrate:
    image: oryd/kratos:v25.4.0
    container_name: writing-coach-kratos-migrate
    restart: on-failure
    entrypoint: ["/bin/sh"]
    environment:
      DSN: "sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc"
      SECRETS_COOKIE_0: "${KRATOS_COOKIE_SECRET:-change-me-change-me-change-me-change-me}"
      SECRETS_CIPHER_0: "${KRATOS_CIPHER_SECRET:-change-me-change-me-change-me-change-me}"
      COACH_PUBLIC_URL: "${COACH_PUBLIC_URL:-https://coach.tomasino.org}"
      KRATOS_PUBLIC_BASE_URL: "${KRATOS_PUBLIC_BASE_URL:-${COACH_PUBLIC_URL:-https://coach.tomasino.org}/.ory/kratos/public}"
      KRATOS_ADMIN_BASE_URL: "http://kratos:4434/"
      KRATOS_UI_PUBLIC_URL: "${KRATOS_UI_PUBLIC_URL:-${COACH_PUBLIC_URL:-https://coach.tomasino.org}}"
      KRATOS_ALLOWED_RETURN_URLS: "${KRATOS_ALLOWED_RETURN_URLS:-${COACH_PUBLIC_URL:-https://coach.tomasino.org},${COACH_PUBLIC_URL:-https://coach.tomasino.org}/login,${COACH_PUBLIC_URL:-https://coach.tomasino.org}/register}"
      KRATOS_SMTP_CONNECTION_URI: "${KRATOS_SMTP_CONNECTION_URI:-smtps://test:test@mailslurper:1025/?skip_ssl_verify=true}"
    volumes:
      - kratos-data:/var/lib/sqlite
      - ./deploy/kratos:/etc/config/kratos
    command: ["/etc/config/kratos/render-config.sh", "migrate"]

  kratos:
    image: oryd/kratos:v25.4.0
    container_name: writing-coach-kratos
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailslurper:
        condition: service_started
    environment:
      DSN: "sqlite:///var/lib/sqlite/db.sqlite?_fk=true"
      SECRETS_COOKIE_0: "${KRATOS_COOKIE_SECRET:-change-me-change-me-change-me-change-me}"
      SECRETS_CIPHER_0: "${KRATOS_CIPHER_SECRET:-change-me-change-me-change-me-change-me}"
      LOG_LEVEL: "info"
      COACH_PUBLIC_URL: "${COACH_PUBLIC_URL:-https://coach.tomasino.org}"
      KRATOS_PUBLIC_BASE_URL: "${KRATOS_PUBLIC_BASE_URL:-${COACH_PUBLIC_URL:-https://coach.tomasino.org}/.ory/kratos/public}"
      KRATOS_ADMIN_BASE_URL: "http://kratos:4434/"
      KRATOS_UI_PUBLIC_URL: "${KRATOS_UI_PUBLIC_URL:-${COACH_PUBLIC_URL:-https://coach.tomasino.org}}"
      KRATOS_ALLOWED_RETURN_URLS: "${KRATOS_ALLOWED_RETURN_URLS:-${COACH_PUBLIC_URL:-https://coach.tomasino.org},${COACH_PUBLIC_URL:-https://coach.tomasino.org}/login,${COACH_PUBLIC_URL:-https://coach.tomasino.org}/register}"
      KRATOS_SMTP_CONNECTION_URI: "${KRATOS_SMTP_CONNECTION_URI:-smtps://test:test@mailslurper:1025/?skip_ssl_verify=true}"
    command: ["/etc/config/kratos/render-config.sh", "serve"]
    volumes:
      - kratos-data:/var/lib/sqlite
      - ./deploy/kratos:/etc/config/kratos

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: writing-coach-mailslurper
    restart: unless-stopped

volumes:
  writing-coach-data:
  kratos-data:
