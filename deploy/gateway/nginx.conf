events {}

http {
  upstream writing_coach_api {
    server app:8080;
  }

  upstream kratos_public {
    server kratos:4433;
  }

  upstream kratos_ui {
    server kratos-selfservice-ui:3000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
      proxy_pass http://writing_coach_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /.ory/kratos/public/ {
      proxy_pass http://kratos_public/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /.ory/kratos/ui/ {
      proxy_pass http://kratos_ui/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
      return 404;
    }

    location / {
      return 404;
    }
  }
}
